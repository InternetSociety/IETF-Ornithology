# Sample workflow for building and deploying a mdBook site to GitHub Pages
#
# To get started with mdBook see: https://rust-lang.github.io/mdBook/index.html
#




name: Deploy mdBook site to Pages

on:
  # Runs on pushes targeting the default branch
  # push:
  #   branches: ["main"]
  
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-24.04
    env:
      MDBOOK_VERSION: 0.4.52
      MDBOOK_PANDOC_VERSION: 0.10.5
      PANDOC_VERSION: 3.5

    steps:
      - uses: actions/checkout@v4

      - name: Install prebuilt mdBook tools
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            --output mdbook.tar.gz
          echo "c0b903f01dd8f4edc644372ad2b80b1fdddd12552d37b6a098657cbd8eddd768  mdbook.tar.gz" | sha256sum --check
          tar -xzf mdbook.tar.gz mdbook
          sudo install -m 0755 mdbook /usr/local/bin/mdbook

          curl --fail --location --silent --show-error \
            "https://github.com/max-heller/mdbook-pandoc/releases/download/v${MDBOOK_PANDOC_VERSION}/mdbook-pandoc-x86_64-unknown-linux-gnu.tar.xz" \
            --output mdbook-pandoc.tar.xz
          echo "4b80944a05774efd03a49c5a9facf5ea3885eca96b9a7caca1576f9f0058bb4d  mdbook-pandoc.tar.xz" | sha256sum --check
          tar -xJf mdbook-pandoc.tar.xz mdbook-pandoc-x86_64-unknown-linux-gnu/mdbook-pandoc
          sudo install -m 0755 mdbook-pandoc-x86_64-unknown-linux-gnu/mdbook-pandoc /usr/local/bin/mdbook-pandoc

      - name: Download Pandoc
        run: |
          curl --fail --location --silent --show-error \
            "https://github.com/jgm/pandoc/releases/download/${PANDOC_VERSION}/pandoc-${PANDOC_VERSION}-1-amd64.deb" \
            --output pandoc.deb

      - name: Install PDF dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ./pandoc.deb \
            texlive-luatex \
            texlive-latex-base \
            texlive-science \
            texlive-latex-extra \
            fonts-open-sans



      - name: Build with mdBook
        run: mdbook build
      - name: Copy the PDF to html root
        run: cp ./book/pandoc/pdf/IETF-Ornithology.pdf ./book/html

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./book/html


  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

            
